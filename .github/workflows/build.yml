name: Build QGIS+

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v4.2.1-r16"
        required: false
        type: string
      build_windows:
        description: "Build Windows x64"
        required: true
        default: true
        type: boolean
      build_macos_intel:
        description: "Build macOS Intel"
        required: true
        default: true
        type: boolean
      build_macos_arm64:
        description: "Build macOS Apple Silicon"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v4.*"
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

concurrency:
  group: qgisplus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"
  PYTHON_VERSION: "3.11"
  AQT_VERSION: "3.3.0"

jobs:
  versions:
    name: Resolve stable releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      qgis_tag: ${{ steps.releases.outputs.qgis_tag }}
      qgis_version: ${{ steps.releases.outputs.qgis_version }}
      qlementine_tag: ${{ steps.releases.outputs.qlementine_tag }}
      windows_name: ${{ steps.packages.outputs.windows_name }}
      windows_url: ${{ steps.packages.outputs.windows_url }}
      windows_checksum_url: ${{ steps.packages.outputs.windows_checksum_url }}
      macos_name: ${{ steps.packages.outputs.macos_name }}
      macos_url: ${{ steps.packages.outputs.macos_url }}
      macos_checksum_url: ${{ steps.packages.outputs.macos_checksum_url }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      package_matrix: ${{ steps.matrix.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: release
        name: Resolve requested release tag
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
      - id: releases
        name: Resolve QGIS and Qlementine releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          arguments=(--github-output "${GITHUB_OUTPUT}")
          if [[ -n "${RELEASE_TAG}" ]]; then
            arguments+=(--build-tag "${RELEASE_TAG}")
          fi
          python scripts/resolve_versions.py "${arguments[@]}"
      - id: packages
        name: Resolve official binary packages
        shell: bash
        run: |
          python scripts/resolve_binary_packages.py \
            --qgis-version "${{ steps.releases.outputs.qgis_version }}" \
            --github-output "${GITHUB_OUTPUT}"
      - id: matrix
        name: Resolve selected platforms
        shell: bash
        env:
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_MACOS_INTEL: ${{ inputs.build_macos_intel }}
          BUILD_MACOS_ARM64: ${{ inputs.build_macos_arm64 }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            BUILD_WINDOWS=true
            BUILD_MACOS_INTEL=true
            BUILD_MACOS_ARM64=true
          fi
          python scripts/resolve_package_matrix.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --build-windows "${BUILD_WINDOWS:-true}" \
            --build-macos-intel "${BUILD_MACOS_INTEL:-true}" \
            --build-macos-arm64 "${BUILD_MACOS_ARM64:-true}" \
            --github-output "${GITHUB_OUTPUT}"

  package:
    name: ${{ matrix.name }}
    needs: versions
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.versions.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Qlementine release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oclero/qlementine
          ref: ${{ needs.versions.outputs.qlementine_tag }}
          path: upstream/qlementine
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lightweight build tools
        run: python -m pip install --disable-pip-version-check aqtinstall==${{ env.AQT_VERSION }} ninja

      - name: Restore Qt SDK cache
        id: qt-cache
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: .cache/Qt
          key: qgisplus-qt-${{ runner.os }}-${{ matrix.arch }}-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}
      - name: Install or validate Qt on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:GITHUB_WORKSPACE ".cache/Qt/$env:QT_VERSION/msvc2022_64"
          if (-not (Test-Path -LiteralPath "$qtRoot/bin/Qt6Core.dll" -PathType Leaf)) {
            Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".cache/Qt") -Recurse -Force -ErrorAction SilentlyContinue
            python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "$env:GITHUB_WORKSPACE/.cache/Qt"
          }
          if (-not (Test-Path -LiteralPath "$qtRoot/bin/Qt6Core.dll" -PathType Leaf)) {
            throw "Qt SDK validation failed: $qtRoot"
          }
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install or validate Qt on macOS
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          qt_root="${GITHUB_WORKSPACE}/.cache/Qt/${QT_VERSION}/macos"
          if [[ ! -x "${qt_root}/bin/qtpaths" ]]; then
            rm -rf "${GITHUB_WORKSPACE}/.cache/Qt"
            python -m aqt install-qt mac desktop "${QT_VERSION}" clang_64 \
              --outputdir "${GITHUB_WORKSPACE}/.cache/Qt"
          fi
          test -x "${qt_root}/bin/qtpaths"
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"

      - name: Configure and build Windows overlay
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -D CMAKE_BUILD_TYPE=Release `
            -D CMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -D QGISPLUS_QLEMENTINE_SOURCE_DIR="$env:GITHUB_WORKSPACE/upstream/qlementine" `
            -D QGISPLUS_QLEMENTINE_TAG="${{ needs.versions.outputs.qlementine_tag }}"
          cmake --build build --parallel 2
          ctest --test-dir build -C Release --output-on-failure
      - name: Configure and build macOS overlay
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_PREFIX_PATH="${QT_ROOT}" \
            -D CMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -D QGISPLUS_QLEMENTINE_SOURCE_DIR="${GITHUB_WORKSPACE}/upstream/qlementine" \
            -D QGISPLUS_QLEMENTINE_TAG="${{ needs.versions.outputs.qlementine_tag }}"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Restore official QGIS installer cache
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: .cache/qgis-installer
          key: qgisplus-official-${{ matrix.qt_host }}-${{ needs.versions.outputs.qgis_version }}
      - name: Download verified Windows MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python scripts/download_verified.py `
            --url "${{ needs.versions.outputs.windows_url }}" `
            --checksum-url "${{ needs.versions.outputs.windows_checksum_url }}" `
            --output ".cache/qgis-installer/${{ needs.versions.outputs.windows_name }}"
      - name: Download verified macOS DMG
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          python scripts/download_verified.py \
            --url "${{ needs.versions.outputs.macos_url }}" \
            --checksum-url "${{ needs.versions.outputs.macos_checksum_url }}" \
            --output ".cache/qgis-installer/${{ needs.versions.outputs.macos_name }}"

      - name: Extract and stage official Windows runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ifwRoot = Join-Path $env:RUNNER_TEMP "qgisplus-ifw"
          $runtime = Join-Path $ifwRoot "packages/org.qgisplus.desktop/data"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $msi = Resolve-Path ".cache/qgis-installer/${{ needs.versions.outputs.windows_name }}"
          & msiexec.exe /a $msi /qn "TARGETDIR=$runtime"
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "Administrative MSI extraction failed with exit code $LASTEXITCODE"
          }
          python scripts/stage_windows_binary.py `
            --runtime $runtime `
            --launcher "build/launcher/QGIS+.exe" `
            --style-plugin "build/plugins/styles/qgisplusstyle.dll"
          python scripts/prepare_ifw_package.py `
            --runtime $runtime `
            --output $ifwRoot `
            --version "${{ needs.versions.outputs.qgis_version }}" `
            --license LICENSE `
            --install-script packaging/ifw/installscript.qs
          "IFW_ROOT=$ifwRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore Qt Installer Framework cache
        if: matrix.platform == 'windows'
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: .cache/QtIFW
          key: qgisplus-qtifw-4.7
      - name: Install or validate Qt Installer Framework
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ifwRoot = Join-Path $env:GITHUB_WORKSPACE ".cache/QtIFW"
          $binaryCreator = Join-Path $ifwRoot "Tools/QtInstallerFramework/4.7/bin/binarycreator.exe"
          if (-not (Test-Path -LiteralPath $binaryCreator -PathType Leaf)) {
            Remove-Item -LiteralPath $ifwRoot -Recurse -Force -ErrorAction SilentlyContinue
            python -m aqt install-tool windows desktop tools_ifw qt.tools.ifw.47 --outputdir $ifwRoot
          }
          if (-not (Test-Path -LiteralPath $binaryCreator -PathType Leaf)) {
            throw "Qt Installer Framework validation failed"
          }
          "BINARYCREATOR=$binaryCreator" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create Windows offline installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $output = "dist/QGISPlus-${{ needs.versions.outputs.qgis_version }}-Windows-x64.exe"
          & $env:BINARYCREATOR -c "$env:IFW_ROOT/config/config.xml" -p "$env:IFW_ROOT/packages" $output
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "QtIFW failed to create $output"
          }

      - name: Extract official macOS application
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          bash scripts/extract_official_macos.sh \
            ".cache/qgis-installer/${{ needs.versions.outputs.macos_name }}" \
            "${RUNNER_TEMP}/official/QGIS.app"
      - name: Create architecture-specific macOS DMG
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          mkdir -p dist
          output="dist/QGISPlus-${{ needs.versions.outputs.qgis_version }}-${{ matrix.platform }}.dmg"
          bash scripts/package_macos_binary.sh \
            "${RUNNER_TEMP}/official/QGIS.app" \
            "build/plugins/styles/libqgisplusstyle.so" \
            "build/launcher/QGISPlusLauncher" \
            "${{ matrix.arch }}" \
            "${{ needs.versions.outputs.qgis_version }}" \
            "${output}"
          test -s "${output}"

      - name: Upload installable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged build
    needs: [versions, package]
    if: needs.versions.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@3e5f45ac13d11f351dd7ea2ef4a21ef4880c1755 # v8.0.1
        with:
          pattern: QGISPlus-*
          path: dist
          merge-multiple: true
      - name: Validate complete release payload
        shell: bash
        run: |
          shopt -s nullglob
          windows=(dist/*Windows-x64.exe)
          intel=(dist/*macos-intel.dmg)
          arm64=(dist/*macos-arm64.dmg)
          if (( ${#windows[@]} != 1 || ${#intel[@]} != 1 || ${#arm64[@]} != 1 )); then
            echo "Release requires exactly one package for every platform." >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.versions.outputs.release_tag }}
          QGIS_VERSION: ${{ needs.versions.outputs.qgis_version }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "QGIS+ ${RELEASE_TAG}" \
              --notes "QGIS+ based on the official QGIS ${QGIS_VERSION} binaries with the Qlementine style enabled by default."
          fi
